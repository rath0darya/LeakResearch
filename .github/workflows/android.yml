name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: leakresearch-android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare APK and checksum
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk LeakResearch.apk
          sha256sum LeakResearch.apk > LeakResearch.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LeakResearch-APK
          path: |
            LeakResearch.apk
            LeakResearch.apk.sha256
          if-no-files-found: error
      - name: Publish or replace latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "LeakResearch — Latest" --notes "Latest automated Android APK."
          gh release upload "$TAG" LeakResearch.apk LeakResearch.apk.sha256 --clobber
