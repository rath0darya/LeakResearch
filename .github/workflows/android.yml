name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LeakResearch.apk
      - name: Calculate SHA-256
        run: sha256sum LeakResearch.apk > LeakResearch.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LeakResearch-APK
          path: |
            LeakResearch.apk
            LeakResearch.apk.sha256
      - name: Publish latest release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "LeakResearch $TAG" --notes "Android APK build."
          gh release upload "$TAG" LeakResearch.apk LeakResearch.apk.sha256 --clobber
